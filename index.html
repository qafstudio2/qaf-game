</article></section><footer><span>QAF.</span><span>GAME / PLAY / EXPERIMENT</span></footer></main><script>

(function(){
  if(!document.documentElement.classList.contains('friend-embed')){
    document.querySelectorAll('iframe[data-src]').forEach(frame=>{frame.src=frame.dataset.src});
    const toggle=document.getElementById('game-nav-toggle');
    toggle.addEventListener('click',()=>{const open=document.body.classList.toggle('game-nav-open');toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'隱藏標籤':'顯示標籤');});
    document.querySelector('.game-side-nav').addEventListener('click',()=>{document.body.classList.remove('game-nav-open');toggle.setAttribute('aria-expanded','false');toggle.setAttribute('aria-label','顯示標籤');});
    if(location.origin==='https://qaf.tw')fetch('/account/whoami',{credentials:'same-origin',cache:'no-store'}).then(async r=>{
      if(!r.ok)return;const account=await r.json();if(typeof account.id!=='string'||!account.id)return;
      const link=document.getElementById('game-account-link');link.textContent='LOG OUT';link.title='已登入：'+account.id;link.setAttribute('aria-label','登出 '+account.id);link.href='/game/';
      link.addEventListener('click',async event=>{event.preventDefault();try{await fetch('/api/session/logout',{method:'POST',credentials:'same-origin'});}finally{location.href='/game/';}});
    }).catch(()=>{});
    return;
  }
  const games=Array.from(document.querySelectorAll('.game-card')).map(card=>({
    id:card.id,title:card.dataset.title,url:card.querySelector('iframe').dataset.src,
    cover:card.dataset.cover||(card.id==='aii'?'aii/share-face-5.png':'share-qaf.png')
  }));
  const main=document.querySelector('main');
  main.replaceChildren();
  const catalogue=document.createElement('section');
  catalogue.className='friend-catalogue';catalogue.setAttribute('aria-label','選擇遊戲');
  const player=document.createElement('section');
  player.className='friend-player';player.hidden=true;
  player.innerHTML='<div class="friend-player-bar"><h2></h2><button class="friend-back" type="button">退出遊戲</button></div><div class="friend-screen"></div>';
  main.append(catalogue,player);
  let lastHeight=0,activeButton=null,resizeQueued=false;
  function notify(type,extra={}){
    if(window.parent!==window)window.parent.postMessage({namespace:'qaf-game',type,...extra},location.origin);
  }
  function reportSize(){
    resizeQueued=false;
    const height=Math.ceil(main.getBoundingClientRect().height);
    if(height>0&&height!==lastHeight){lastHeight=height;notify('resize',{height});}
  }
  function queueSize(){if(!resizeQueued){resizeQueued=true;requestAnimationFrame(reportSize)}}
  function exitGame(){
    player.querySelector('.friend-screen').replaceChildren();
    player.hidden=true;catalogue.hidden=false;
    if(activeButton)activeButton.focus({preventScroll:true});
    queueSize();notify('scroll-top');
  }
  player.querySelector('.friend-back').addEventListener('click',exitGame);
  window.addEventListener('message',event=>{
    const frame=player.querySelector('.friend-screen iframe');
    if(frame&&event.origin===location.origin&&event.source===frame.contentWindow&&event.data?.namespace==='qaf-game'&&event.data.type==='exit-game')exitGame();
  });
  function openGame(game,button){
    activeButton=button;catalogue.hidden=true;player.hidden=false;
    player.querySelector('h2').textContent=game.title;
    const frame=document.createElement('iframe');
    frame.title=game.title+'遊戲畫面';
    frame.setAttribute('allow','autoplay; fullscreen; web-share');
    frame.setAttribute('allowfullscreen','');
    // Keep every exit inside the catalogue, never navigate the hosting site.
    frame.setAttribute('sandbox','allow-scripts allow-same-origin allow-forms allow-pointer-lock');
    frame.addEventListener('load',()=>{
      try{
        const doc=frame.contentDocument;
        doc.querySelectorAll('a[target="_top"]').forEach(link=>{
          link.removeAttribute('target');
          link.setAttribute('href','#game-catalogue');
          link.setAttribute('aria-label','退出遊戲，回到遊戲列表');
          link.addEventListener('click',event=>{event.preventDefault();exitGame()});
        });
      }catch(error){/* The outer Exit remains available if a game cannot be inspected. */}
    });
    frame.src=game.url;
    player.querySelector('.friend-screen').replaceChildren(frame);
    player.querySelector('.friend-back').focus({preventScroll:true});
    queueSize();notify('scroll-top');
  }
  games.forEach((game,index)=>{
    const button=document.createElement('button');button.type='button';button.className='friend-card';
    const cover=document.createElement('img');cover.src=game.cover;cover.alt='';cover.loading='lazy';
    const title=document.createElement('strong');title.textContent=game.title;
    const label=document.createElement('small');label.textContent='GAME '+String(index+1).padStart(3,'0')+' · 點擊開始';
    const count=document.createElement('small');count.className='play-count';count.dataset.playCount=game.id;count.textContent='遊玩次數載入中…';button.append(cover,title,label,count);button.addEventListener('click',()=>openGame(game,button));catalogue.append(button);
  });
  // Measure intrinsic main content, not viewport/scrollHeight: avoids iframe resize feedback.
  if('ResizeObserver' in window)new ResizeObserver(queueSize).observe(main);
  window.addEventListener('resize',queueSize);
  window.addEventListener('load',queueSize);
  queueSize();
})();

document.querySelectorAll('.game-card').forEach(card=>{
  const url=new URL(card.dataset.url,location.href).href;
  const notice=card.querySelector('.notice');
  card.querySelector('[data-action="share"]').addEventListener('click',async()=>{
    try{
      if(navigator.share){await navigator.share({title:card.dataset.title+'｜QAF 的遊戲空間',text:card.dataset.share,url});return;}
      await navigator.clipboard.writeText(url);
      notice.textContent='已複製遊戲連結';
    }catch(error){if(error.name!=='AbortError')notice.textContent='遊戲連結：'+url;}
  });
});
</script><script src="play-count.js?v=game-card-icons-20261016"></script></body></html>
